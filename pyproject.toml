# pyproject.toml
[build-system]
requires = ["setuptools>=42", "wheel", "setuptools_scm[toml]>=3.4", "numpy", "scikit-build", "ninja", "cmake>=3.18"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "fc/_version.py"

[tool.pytest.ini_options]
addopts = "--import-mode importlib"
