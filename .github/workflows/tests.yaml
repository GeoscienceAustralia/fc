name: Test and release

on:
  push:
  pull_request:
#  release:
#    types: [created]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    name: Python ${{ matrix.python-version }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          activate-environment: fc
          mamba-version: "*"
          channels: conda-forge,defaults
          channel-priority: true
      - run: |
          conda info
          conda list
          conda config --show-sources
          conda config --show
          python --version
          which python
      - name: Install conda dependencies
        run: |
          mamba install --override-channels -c conda-forge \
          datacube gdal pycodestyle pylint pytest-cov pytest numexpr lxml pydash python-rapidjson \
          lxml pydash python-rapidjson ruamel.yaml structlog ciso8601 cattrs boltons python-build eodatasets3
      - name: Build package
        run: |
          python -m build
      - name: Install from local dir
        run: |
          pip install dist/*.whl
      - name: Check code
        run: |
          pip freeze
          python -c 'import fc.unmix'
          ./check-code.sh
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.python-version }}
          path: dist

      - uses: codecov/codecov-action@v4
        with:
          env_vars: OS,PYTHON
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: false
